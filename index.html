<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Show Project | Dagim Daniel</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <script src="script.js" defer></script>
  </head>

  <body>
    <header class="controls-container">
      <div class="control-group">
        <label for="search-input">Search episodes:</label>
        <input
          type="search"
          id="search-input"
          placeholder="Type to search..."
          aria-label="Search episodes"
        />
      </div>

      <div class="control-group">
        <label for="episode-select">Jump to episode:</label>
        <select id="episode-select" aria-label="Select an episode">
          <option value="ALL">Show all episodes</option>
        </select>
      </div>

      <p id="episode-count" aria-live="polite">Displaying 0 / 0 episodes</p>
    </header>

    <template id="episode-template">
      <section class="episode-card">
        <h2 class="episode-title"></h2>
        <img class="episode-image" src="" alt="" />
        <div class="episode-summary"></div>
      </section>
    </template>

    <main id="root" aria-label="TV Episodes Catalog"></main>

    <footer id="bottom-bar">
      <span>Original Link: </span>
      <a
        id="original-link"
        href="https://tvmaze.com/"
        target="_blank"
        rel="noopener noreferrer"
      >
        TVMaze.com
      </a>
    </footer>
  </body>
</html>
