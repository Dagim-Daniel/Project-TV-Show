<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="script.js" defer></script>

    <title>TV Show Project | Dagim Daniel</title>
    <link href="style.css" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  </head>

  <body>
    <header id="controls">
      <select id="show-select" aria-label="Select a TV show">
        <!-- Show options populated dynamically -->
      </select>

      <select id="episode-select" aria-label="Select an episode">
        <option value="ALL">All Episodes</option>
      </select>

      <input
        type="text"
        id="search-input"
        placeholder="Search episodes..."
        aria-label="Search episodes"
      />

      <span id="match-count" aria-live="polite"></span>
    </header>

    <main id="main-content">
      <div id="loading-indicator" class="status-message">
        Loading data, please wait...
      </div>
      <div id="error-message" class="status-message error-state" hidden></div>
      <div id="root" aria-label="TV Show Project"></div>
    </main>

    <template id="episode-template">
      <section class="episode-card">
        <h2 class="episode-title"></h2>
        <img class="episode-image" src="" alt="" />
        <div class="episode-summary"></div>
      </section>
    </template>

    <footer id="bottomBar">
      <span>Original Link: </span>
      <a id="original-link" href="https://tvmaze.com/" target="_self"
        >TVMaze.com</a
      >
    </footer>
  </body>
</html>
